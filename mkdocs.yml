site_name: Streetscapes
repo_url: https://github.com/Urban-M4/streetscapes
nav:
  - Overview: index.md
  - Tutorials:
      - Introduction: tutorial/tutorial.md
      - Streetscapes CLI: tutorial/cli.md
      - Image sources: tutorial/sources.md
      - Segmentation models: tutorial/models.md
      - Streetscapes Explorer: tutorial/explorer.md
      - Local images: tutorial/local-images.md
      - WRF input files: tutorial/wrf-input.md
      - Access database from Python: tutorial/manual-database-access.ipynb
  - Examples:
      - Facade classification in Amsterdam: examples/ams-map-workflow.ipynb
      - Facade classification with confidence: examples/ams-map-workflow-confidence.ipynb
      - Facade emissivity map: examples/ams-emissivity.ipynb
      - Facade albedo: examples/ams-albedo.ipynb
      - Building color analysis: examples/ams-building-color.ipynb
  - About:
      - Licence: about/licence.md
      - Contributing: about/contributing.md
      - Citation: about/citation.md
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: blue grey
      accent: cyan
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: blue grey
      accent: cyan

  features:
    - navigation.footer
  font:
    text: Roboto
    code: Roboto Mono
  locale: en
  highlightjs: true
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
plugins:
  - search
  - mkdocs-autoapi:
      autoapi_dir: src
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: false
            group_by_category: false
            relative_crossrefs: true
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true
      include_source: true
extra:
  version:
    provider: mike
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
hooks:
  - docs/mermaid-hook.py
