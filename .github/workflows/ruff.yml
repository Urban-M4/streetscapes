name: Lint with Ruff

on:
  pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        id: ruff
        run: |
          ruff check src --exit-zero --output-format github