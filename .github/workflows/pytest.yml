name: Python Tests

on:
  pull_request

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install uv
        run: pip install uv

      - name: Install dependencies with uv
        run: uv install

      - name: Run tests
        run: uv run pytest -v --maxfail=1 --disable-warnings